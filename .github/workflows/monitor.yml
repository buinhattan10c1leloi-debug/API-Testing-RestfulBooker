name: Production Health Check Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          postman login --with-api-key PMAK-6ad641ad2c96cb000148088d-e1814e4a85fe0c255ef2d17e70ec6dcb1a

      - name: Run API tests
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          postman collection run "34104301-5ea66b53-dd9b-47ef-840c-45823c2df9ce"
